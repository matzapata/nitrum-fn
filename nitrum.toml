# Enclave workload: nitrum-fn-host (invoke). Built by `nitrum build` from ./Dockerfile.
# Management API is Fargate (`Dockerfile.api`).
# Schema: https://github.com/matzapata/nitrum/blob/develop/crates/config/src/sections/
# Must match Terraform `project_name` (one slug per AWS account). Env is DNS + account.

[project]
name = "nitrum-fn"
port = 8080
start_command = ["/app/nitrum-fn-host"]

[runtime]
data_plane = "ghcr.io/matzapata/nitrum/data-plane:latest"
control_plane = "ghcr.io/matzapata/nitrum/control-plane:latest"
nitro_cli = "ghcr.io/matzapata/nitrum/nitro-cli:latest"

[health_check]
path = "/healthz"
port = 8080
interval = 10

[scaling]
desired_replicas = 1
max_replicas = 2
min_replicas = 1
num_cpus = 2
ram_size_mib = 4320
instance_type = "m6i.xlarge"

[cloud]
xray_tracing = false
log_retention_days = 7
safe_rolling = true

[tls_termination]
# Local / first bring-up. For cloud invoke DNS set acme = true and domain to invoke_hostname.
acme = false
domain = "fn.localhost"

[egress]
# Whitelist when true. Implicit allows: KMS, SSM, DynamoDB, IMDS, OTLP.
# S3 hostnames are listed in destinations below.
enabled = true
destinations = [
  "s3\\.amazonaws\\.com$",
  "s3\\.[a-z0-9-]+\\.amazonaws\\.com$",
  ".+\\.s3\\.[a-z0-9-]+\\.amazonaws\\.com$",
  ".+\\.s3\\.amazonaws\\.com$",
]
