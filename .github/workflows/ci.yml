name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Rust Lint (Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Rust Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Test
        run: cargo test --workspace --lib --bins

  adapters:
    name: Adapter tests (Floci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Start Floci
        run: docker compose up -d --remove-orphans floci
      - name: Test catalog + artifacts adapters
        env:
          NITRUM_FN_ARTIFACTS__ENDPOINT: http://127.0.0.1:4566
          NITRUM_FN_CATALOG__ENDPOINT: http://127.0.0.1:4566
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: cargo test --tests -p catalog -p artifacts
      - name: Stop Floci
        if: always()
        run: docker compose down --remove-orphans

  e2e:
    name: E2E (publish + invoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl
      - name: E2E
        run: bash tests/e2e/local.sh

  publish-images:
    name: Publish images (GHCR)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [fmt, lint, audit, test, adapters, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/${{ github.repository }}/api
      WORKER_IMAGE: ghcr.io/${{ github.repository }}/publish-worker
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push publish-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.publish-worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=publish-worker
          cache-to: type=gha,mode=max,scope=publish-worker
      - name: Make packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          name="${{ github.event.repository.name }}"
          if [[ "${{ github.event.repository.owner.type }}" == "Organization" ]]; then
            base="/orgs/${owner}/packages/container"
          else
            base="/user/packages/container"
          fi
          for pkg in "${name}%2Fapi" "${name}%2Fpublish-worker"; do
            gh api --method PUT "${base}/${pkg}/visibility" -f visibility=public
          done
