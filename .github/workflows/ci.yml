name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Rust Lint (Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Rust Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Test
        run: cargo test --workspace --lib --bins

  adapters:
    name: Adapter tests (Floci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Start Floci
        run: docker compose up -d --remove-orphans floci
      - name: Test catalog + artifacts adapters
        env:
          NITRUM_FN_ARTIFACTS__ENDPOINT: http://127.0.0.1:4566
          NITRUM_FN_CATALOG__ENDPOINT: http://127.0.0.1:4566
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: cargo test --tests -p catalog -p artifacts
      - name: Stop Floci
        if: always()
        run: docker compose down --remove-orphans

  e2e:
    name: E2E (publish + invoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          cache-on-failure: true
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl
      - name: E2E
        run: bash tests/e2e/local.sh
