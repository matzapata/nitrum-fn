[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["examples/hello-world"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
executor = { path = "crates/executor" }
catalog = { path = "crates/catalog" }
artifacts = { path = "crates/artifacts" }
runtime = { path = "crates/runtime" }
runtime-macros = { path = "crates/runtime-macros" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
hex = "0.4"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = "31"
wat = "1"
