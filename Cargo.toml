[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["examples/hello-world"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
executor = { path = "crates/executor" }
catalog = { path = "crates/catalog" }
artifacts = { path = "crates/artifacts" }
messaging = { path = "crates/messaging" }
runtime = { path = "crates/runtime" }
runtime-macros = { path = "crates/runtime-macros" }
api = { path = "crates/api" }
cli = { path = "crates/cli" }
telemetry = { path = "crates/telemetry" }

anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sns = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio"] }
# Hyper 1.x + rustls 0.23 + ring (not the legacy rustls 0.21 stack, and not aws-lc).
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
axum = "0.8"
criterion = "0.5"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
hex = "0.4"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# unicode-rs backend; keep pinned if ICU crates force a higher MSRV than intended.
idna_adapter = "=1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.30"
opentelemetry = { version = "0.29", features = ["metrics", "trace", "logs"] }
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio", "metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "http-json", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.29"
# 36.0.14 is the patched 36.x line (37–45 omit some advisories; 46+ is a larger API jump).
wasmtime = "36.0.14"
wat = "1"
