[package]
name = "hello-world"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Sample nitrum-fn function"

[lib]
crate-type = ["cdylib"]

[dependencies]
runtime = { path = "../../crates/runtime" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
