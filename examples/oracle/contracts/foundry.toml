[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../enclave" },
]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@nitro-validator/=lib/nitro-validator/src/",
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 120
