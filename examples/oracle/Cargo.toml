[package]
name = "oracle"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "CoinGecko price oracle sample for nitrum-fn"

[lib]
crate-type = ["cdylib"]

[dependencies]
runtime = { path = "../../crates/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
